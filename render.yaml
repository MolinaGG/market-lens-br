# Demonstração pública em dois serviços gratuitos do Render.
# A API hiberna após inatividade; os retratos SQLite são restaurados na inicialização.
services:
  - type: web
    name: market-lens-br-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.data.demo && python -m app.data.demo --database data/company_news.db --archive demo/company_news_snapshot.sqlite.gz && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: CACHE_BACKEND
        value: none
      - key: LOCAL_IMPORT_ENABLED
        value: "false"
  - type: web
    name: market-lens-br-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://market-lens-br-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
