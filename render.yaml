# Blueprint do backend no Render (plano gratuito).
# Observação: o plano gratuito hiberna após inatividade e o disco é temporário.
services:
  - type: web
    name: market-lens-br-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.data.demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CACHE_BACKEND
        value: none
