name: Verify research demo

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Test backend
        run: python -m pytest backend/tests -q
      - name: Verify frozen databases
        run: |
          cd backend
          python -m app.data.demo --database data/market_lens.db --archive demo/open_data_snapshot.sqlite.gz
          python -m app.data.demo --database data/company_news.db --archive demo/company_news_snapshot.sqlite.gz
          python -c "import sqlite3; from pathlib import Path; assert all(sqlite3.connect(Path('data') / name).execute('PRAGMA integrity_check').fetchone()[0] == 'ok' for name in ('market_lens.db', 'company_news.db'))"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
